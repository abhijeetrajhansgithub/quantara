[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantara"
version = "0.1.5.1"
description = "A local-first vector database engine with pluggable indexes, collection management, metadata filtering, and vector similarity search."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Abhijeet Rajhans" }
]

license = { text = "MIT" }

keywords = [
    "vector-database",
    "vector-search",
    "similarity-search",
    "embeddings",
    "rag",
    "retrieval-augmented-generation",
    "database",
    "local-database",
    "ai",
    "machine-learning"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]


dependencies = [
    "numpy>=1.21.2"
]

[project.optional-dependencies]
ollama = [
    "ollama>=0.6.2"
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "build>=1.5.0",
    "pyright>=1.1.410",
    "twine>=6.2.0"
]

[project.urls]
Homepage = "https://github.com/abhijeetrajhansgithub/quantara"
Repository = "https://github.com/abhijeetrajhansgithub/quantara"
Issues = "https://github.com/abhijeetrajhansgithub/quantara/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["quantara*"]
